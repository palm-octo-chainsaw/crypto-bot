name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral CI-only database: allow passwordless local connections so
          # no credential literal is needed (keeps secret scanners happy).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # `cache: pip` on setup-python writes an entry per ref, and this job runs
      # on every PR push — scopes only their own run can read, filling the repo's
      # 10 GB budget for nothing. Restore here, save below on master only: an
      # entry on the default branch is readable from every ref, so PRs get the
      # wheels without leaving anything behind.
      - id: pip-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.14-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.14-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Save pip cache
        if: github.ref == 'refs/heads/master' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: |
          mkdir -p logs
          pytest --cov=. --cov-report=xml --cov-branch

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
