name: Hermes PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push supersedes the review still running for the previous head.
concurrency:
  group: hermes-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks cannot read the secrets this job needs, so skip them instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Hand the event to Hermes
        env:
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # MagicDNS is not configured on the runner, so ask for the peer's address.
          host="$(tailscale ip -4 archlinux)"
          # The secret stays in the environment; an openssl argument would show up in ps.
          sig="sha256=$(python3 -c 'import hashlib, hmac, os; print(hmac.new(os.environb[b"HERMES_WEBHOOK_SECRET"], open(os.environ["GITHUB_EVENT_PATH"], "rb").read(), hashlib.sha256).hexdigest())')"
          curl -sS --fail-with-body --max-time 30 \
            -X POST "http://${host}:8644/webhooks/github-pr-review" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: pull_request' \
            -H "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "X-Hub-Signature-256: $sig" \
            --data-binary @"$GITHUB_EVENT_PATH"
