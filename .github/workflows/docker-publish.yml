name: Docker Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish (e.g. v1.5.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            a77878123/crypto-bot:${{ steps.version.outputs.value }}
            a77878123/crypto-bot:latest
          # Read-only on purpose. Actions cache is scoped per git ref, so a
          # `cache-to` here wrote ~570 MB into the tag's own scope that no other
          # run could ever read — 1.7 GB of the 10 GB repo budget across three
          # releases, all of it dead on arrival. warm-build-cache.yml is the
          # only writer; every other build consumes what it left on master.
          cache-from: type=gha

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # Hosted, not self-hosted: this only writes to git now, so a release no
    # longer depends on the runner at home being awake.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: palm-octo-chainsaw/homelab-gitops
          ref: master
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Commit the image tag to the GitOps repo
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          F=manifests/crypto-bot/deployment.yaml
          sed -i -E "s|(^ *image: a77878123/crypto-bot:).*|\1${VERSION}|" "$F"
          grep -q "image: a77878123/crypto-bot:${VERSION}$" "$F" \
            || { echo "::error::tag line not found in $F"; exit 1; }
          # A re-run of an already-deployed tag is a no-op, not a failure.
          if git diff --quiet "$F"; then
            echo "already at ${VERSION}"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Deploy crypto-bot ${VERSION}"
          git push

  verify:
    needs: [publish, deploy]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # Hosted, and reaches the cluster over Tailscale rather than by running on
    # it. The self-hosted version cancelled the release whenever the box at home
    # had its runner down — which is how v1.10.1 went red after deploying fine.
    # The k3s API is only bound to the tailnet, so the job joins as tag:ci and
    # talks to it there; nothing about the cluster is exposed publicly.
    runs-on: ubuntu-latest
    steps:
      - name: The tag serves the image this run built
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          repo=a77878123/crypto-bot
          token=$(curl -fsSL \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" \
            | jq -r .token)
          # Docker-Content-Digest on the manifest is what a node would pull for
          # this tag, so comparing it to the digest the build pushed catches a
          # tag that never landed or that something else has since overwritten.
          got=$(curl -fsSL -I \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/${repo}/manifests/${VERSION}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          echo "registry serves: ${got:-<nothing>}"
          echo "this run built:  ${DIGEST}"
          [ -n "$got" ] && [ "$got" = "$DIGEST" ] \
            || { echo "::error::${VERSION} does not serve this run's image"; exit 1; }

      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write the kubeconfig
        env:
          KUBECONFIG_CI: ${{ secrets.KUBECONFIG_CI }}
        run: |
          # Not a repo file and not $HOME/.kube: RUNNER_TEMP is wiped with the
          # job. The token inside belongs to the read-only ci-verify account.
          umask 077
          printf '%s' "$KUBECONFIG_CI" > "$RUNNER_TEMP/kubeconfig"

      - name: Wait for ArgoCD to apply the new tag
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          # ArgoCD polls git on a 3-minute timer; this makes the deploy immediate
          # instead of leaving the job idling through the next poll.
          kubectl -n argocd annotate application crypto-bot \
            argocd.argoproj.io/refresh=normal --overwrite
          want="a77878123/crypto-bot:${VERSION}"
          deadline=$(( $(date +%s) + 600 ))
          until [ "$(kubectl -n default get deploy crypto-bot \
                     -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$want" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ArgoCD did not apply $want within 10m"; exit 1
            fi
            sleep 10
          done
          # 180s was shorter than the pull it was waiting on: a cold-cache
          # release ships ~600 MB to a node on Wi-Fi, which took 4m15s at v1.9.3
          # and 8m40s at v1.9.0. The job went red on releases that deployed
          # fine. warm-build-cache.yml should keep this in the seconds now, but
          # the budget has to cover the day it misses.
          kubectl -n default rollout status deployment/crypto-bot --timeout=900s

      - name: Verify container status
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          KC="kubectl -n default"
          attempts=3
          # The pipeline ends here. Poll the container status up to $attempts
          # times so a transient not-ready read can't fail an otherwise healthy
          # deploy (and so a container that crashes just after coming up is still
          # caught). Pass on the first healthy read; fail only if all attempts do.
          for i in $(seq 1 "$attempts"); do
            $KC get pods -l app=crypto-bot -o wide
            phase=$($KC get pod -l app=crypto-bot -o jsonpath='{.items[0].status.phase}')
            ready=$($KC get pod -l app=crypto-bot -o jsonpath='{.items[0].status.containerStatuses[0].ready}')
            echo "attempt $i/$attempts: phase=$phase ready=$ready"
            if [ "$phase" = "Running" ] && [ "$ready" = "true" ]; then
              echo "Deploy successful: crypto-bot is Running and ready."
              exit 0
            fi
            [ "$i" -lt "$attempts" ] && sleep 10
          done
          echo "::error::crypto-bot did not reach a successful state after $attempts checks (phase=$phase ready=$ready)"
          exit 1
