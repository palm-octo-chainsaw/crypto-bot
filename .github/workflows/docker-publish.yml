name: Docker Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish (e.g. v1.5.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            a77878123/crypto-bot:${{ steps.version.outputs.value }}
            a77878123/crypto-bot:latest
          # Read-only on purpose. Actions cache is scoped per git ref, so a
          # `cache-to` here wrote ~570 MB into the tag's own scope that no other
          # run could ever read — 1.7 GB of the 10 GB repo budget across three
          # releases, all of it dead on arrival. warm-build-cache.yml is the
          # only writer; every other build consumes what it left on master.
          cache-from: type=gha

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: self-hosted
    steps:
      - name: Roll out new image to k8s
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          sudo -n k3s kubectl -n default set image deployment/crypto-bot \
            bot=a77878123/crypto-bot:"$VERSION"
          # 180s was shorter than the pull it was waiting on: a cold-cache
          # release ships ~600 MB to a node on Wi-Fi, which took 4m15s at v1.9.3
          # and 8m40s at v1.9.0. The job went red on releases that deployed
          # fine. warm-build-cache.yml should keep this in the seconds now, but
          # the budget has to cover the day it misses.
          sudo -n k3s kubectl -n default rollout status deployment/crypto-bot --timeout=900s

      - name: Verify container status
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          KC="sudo -n k3s kubectl -n default"
          attempts=3
          # The pipeline ends here. Poll the container status up to $attempts
          # times so a transient not-ready read can't fail an otherwise healthy
          # deploy (and so a container that crashes just after coming up is still
          # caught). Pass on the first healthy read; fail only if all attempts do.
          for i in $(seq 1 "$attempts"); do
            $KC get pods -l app=crypto-bot -o wide
            phase=$($KC get pod -l app=crypto-bot -o jsonpath='{.items[0].status.phase}')
            ready=$($KC get pod -l app=crypto-bot -o jsonpath='{.items[0].status.containerStatuses[0].ready}')
            echo "attempt $i/$attempts: phase=$phase ready=$ready"
            if [ "$phase" = "Running" ] && [ "$ready" = "true" ]; then
              echo "Deploy successful: crypto-bot is Running and ready."
              exit 0
            fi
            [ "$i" -lt "$attempts" ] && sleep 10
          done
          echo "::error::crypto-bot did not reach a successful state after $attempts checks (phase=$phase ready=$ready)"
          exit 1
