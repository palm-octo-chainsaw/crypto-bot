# crypto-bot Deployment.
#
# The bot is outbound-only (Telegram long-poll + exchange/RPC APIs), so there
# is no Service/Ingress. Exactly ONE instance may poll the Telegram token at a
# time, so:
#   - replicas: 1
#   - strategy: Recreate  (a RollingUpdate would briefly run two pods, causing
#                          Telegram getUpdates 409 conflicts)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-bot
  namespace: default
  labels:
    app: crypto-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crypto-bot
  template:
    metadata:
      labels:
        app: crypto-bot
    spec:
      # Seed a safe fallback targets.json so an empty config volume can never
      # crash-loop the bot (load_json has no missing-file fallback). The real
      # targets are seeded into the PVC at cutover; this only fires if absent.
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - '[ -f /config/targets.json ] || echo "{\"USDC\": 100.0}" > /config/targets.json'
          volumeMounts:
            - name: config
              mountPath: /config
      # ndots:5 is the cluster default, so every external name (api.telegram.org,
      # api.binance.com, ...) is tried against all three search domains first —
      # four lookups per host, each one a chance to time out on a weak link.
      # External names carry enough dots to be used as-is with ndots:1, while
      # bare service names ("postgres") still fall through to the search list.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: timeout
            value: "2"
          - name: attempts
            value: "2"
      containers:
        - name: bot
          image: a77878123/crypto-bot:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: crypto-bot-secret
          # The bot is a single asyncio loop. If it wedges, the process stays up
          # and the container keeps reporting Running, so nothing restarts it —
          # the heartbeat job stops stamping the file and this probe notices.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(cat /tmp/heartbeat) )) -lt 300
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: trw-session
              mountPath: /app/.trw_session
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi  # headroom for the Playwright/Chromium scrape
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: crypto-bot-config
        - name: trw-session
          persistentVolumeClaim:
            claimName: crypto-bot-trw-session
        - name: logs
          emptyDir: {}
