# Nightly restart for the crypto-bot Deployment.
#
# The bot holds a long-lived Playwright/Chromium session and a Telegram
# long-poll; a daily recycle clears leaked browser state and stale sessions.
#
# Scheduled at 00:00 Europe/Sofia (the node's own clock). This is deliberately
# far from the daily RSPS signal, which posts ~00:12 UTC (03:12 local): the
# poller's first run is one full interval after boot (run.py: first=
# SIGNAL_POLL_INTERVAL_SECONDS), so a restart close to the signal could delay
# picking it up.
#
# `rollout restart` respects the Deployment's Recreate strategy, so the old pod
# is torn down before the new one starts — two pods must never long-poll the
# same Telegram token at once.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crypto-bot-restarter
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crypto-bot-restarter
  namespace: default
rules:
  # `rollout restart` patches the pod template annotation, then reads back the
  # rollout status.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["crypto-bot"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crypto-bot-restarter
  namespace: default
subjects:
  - kind: ServiceAccount
    name: crypto-bot-restarter
    namespace: default
roleRef:
  kind: Role
  name: crypto-bot-restarter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crypto-bot-nightly-restart
  namespace: default
spec:
  schedule: "0 0 * * *"
  timeZone: Europe/Sofia
  concurrencyPolicy: Forbid
  # A missed window (node asleep/down) should not fire a late restart on boot.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: crypto-bot-restarter
          restartPolicy: Never
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.35.4
              command:
                - kubectl
                - rollout
                - restart
                - deployment/crypto-bot
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
